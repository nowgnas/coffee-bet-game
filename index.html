<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>☕ 커피 내기</title>
<meta name="description" content="손가락 고르기 · 룰렛 · 사다리타기로 오늘의 커피 당번을 정해요">
<meta name="theme-color" content="#0B0D12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="커피 내기">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FFC56B'/%3E%3Cstop offset='1' stop-color='%23FF8A3D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='26' fill='url(%23g)'/%3E%3Ctext x='50' y='69' font-size='58' text-anchor='middle'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="appleIcon" href="">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#0B0D12;--s1:#141820;--s2:#1C222C;--s3:#262E3A;--line:rgba(255,255,255,.07);
    --text:#F2F4F6;--sub:#8B95A1;--mute:#4E5968;
    --pri:#FFB547;--pri2:#FF8A3D;--onpri:#1A1206;
    --r-lg:24px;--r-md:16px;--r-sm:12px;
    --shadow:0 10px 30px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.04) inset;
    --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
    --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);overscroll-behavior:none;
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    font-size:16px;letter-spacing:-.01em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
  body.lock{position:fixed;inset:0;overflow:hidden;touch-action:none}
  button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:0;background:none}
  button:active:not(:disabled){transform:scale(.96)}
  button{transition:transform .15s var(--ease),background .2s,opacity .2s}

  /* 헤더 + 세그먼트 탭 */
  header{padding:calc(12px + var(--safe-t)) 16px 12px;background:linear-gradient(var(--bg) 70%,rgba(11,13,18,0));position:relative;z-index:5}
  .brand{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
  .logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,#FFC56B,var(--pri2));box-shadow:0 4px 14px rgba(255,138,61,.35)}
  h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.03em}
  .brand small{margin-left:auto;color:var(--sub);font-size:13px;font-weight:500}
  .seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--s1);border-radius:14px;padding:4px;box-shadow:0 0 0 1px var(--line) inset}
  .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:11px;background:var(--s3);box-shadow:0 4px 12px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06) inset;transition:transform .38s var(--spring)}
  .tab{position:relative;z-index:1;min-height:42px;border-radius:11px;font-weight:700;font-size:15px;color:var(--sub);white-space:nowrap}
  .tab.on{color:var(--text)}
  .tab:active:not(:disabled){transform:none}

  main{max-width:560px;margin:0 auto;padding:4px 16px calc(32px + var(--safe-b))}
  .hero{margin:10px 4px 18px}
  .hero h2{font-size:26px;line-height:1.3;margin:0 0 6px;font-weight:800;letter-spacing:-.035em}
  .hero p{margin:0;color:var(--sub);font-size:15px;line-height:1.5}
  .card{background:var(--s1);border-radius:var(--r-lg);padding:20px;margin-bottom:14px;box-shadow:0 0 0 1px var(--line) inset}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .label{font-size:17px;font-weight:700}
  .label small{display:block;color:var(--sub);font-size:13px;font-weight:500;margin-top:3px}
  .stepper{display:flex;align-items:center;background:var(--s2);border-radius:999px;padding:4px}
  .round{width:40px;height:40px;border-radius:50%;background:var(--s3);font-size:22px;line-height:1;font-weight:600;display:grid;place-items:center}
  .round:disabled{opacity:.3}
  .count{font-size:17px;font-weight:800;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
  .names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}
  .nm{position:relative;animation:rise .35s var(--ease) both}
  .nm i{position:absolute;left:14px;top:50%;width:10px;height:10px;border-radius:50%;transform:translateY(-50%);box-shadow:0 0 10px currentColor}
  .nm input{width:100%;height:48px;padding:0 12px 0 34px;font-size:16px;font-weight:600;font-family:inherit;border-radius:var(--r-sm);border:0;background:var(--s2);color:var(--text);outline:none;transition:box-shadow .2s}
  .nm input::placeholder{color:var(--mute)}
  .nm input:focus{box-shadow:0 0 0 2px var(--pri) inset}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:56px;padding:0 20px;border-radius:var(--r-md);background:var(--s2);font-size:17px;font-weight:700}
  .btn.pri{background:linear-gradient(135deg,#FFC56B,var(--pri2));color:var(--onpri);box-shadow:0 8px 24px rgba(255,138,61,.28)}
  .btn:disabled{opacity:.4;cursor:default;box-shadow:none}
  .btns{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
  .btns.two{grid-template-columns:1.4fr 1fr}
  .hint{color:var(--sub);font-size:14px;line-height:1.5;margin:0 0 14px}
  .status{text-align:center;min-height:24px;margin:14px 0 0;font-size:15px;font-weight:600;color:var(--sub)}
  .ctitle{font-size:17px;font-weight:700;margin:0 0 4px}

  .wheelWrap{position:relative;margin:18px auto 4px}
  .wheelWrap::before{content:"";position:absolute;inset:-4%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,181,71,.18),transparent 75%);filter:blur(6px)}
  #wheel{display:block;position:relative;will-change:transform}
  .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
  .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;z-index:3;font-size:16px;font-weight:800;letter-spacing:-.02em;color:var(--onpri);
    background:radial-gradient(circle at 35% 30%,#FFD58A,var(--pri) 45%,var(--pri2));box-shadow:0 0 0 6px var(--bg),0 0 0 8px rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.5)}
  .hub:active:not(:disabled){transform:translate(-50%,-50%) scale(.94)}
  #ladder{display:block;cursor:pointer;touch-action:manipulation;margin:0 auto}

  /* 결과 바텀시트 */
  .overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,6,9,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fade .25s ease both}
  .sheet{position:relative;width:100%;max-width:560px;background:rgba(28,34,44,.92);border-radius:28px 28px 0 0;padding:28px 20px calc(20px + var(--safe-b));text-align:center;
    box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 -20px 60px rgba(0,0,0,.4);animation:up .5s var(--spring) both}
  .sheet .grab{position:absolute;top:10px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:rgba(255,255,255,.18)}
  .badge{width:88px;height:88px;border-radius:50%;margin:6px auto 14px;display:grid;place-items:center;font-size:44px;animation:pop .6s .1s var(--spring) both}
  .sheet .eyebrow{color:var(--sub);font-size:15px;font-weight:600}
  .sheet .who{font-size:36px;font-weight:800;letter-spacing:-.04em;margin:4px 0 8px;word-break:break-all}
  .sheet .tease{font-size:16px;color:#C9D0D8;margin-bottom:22px;line-height:1.5}
  .confetti{position:fixed;left:0;top:0;pointer-events:none;z-index:60}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes rise{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
  .foot{color:var(--mute);font-size:13px;line-height:1.6;margin:18px 6px 0;text-align:center}

  /* 손가락 모드: 헤더 아래 화면 전체가 터치 영역 */
  #finger{position:fixed;left:0;right:0;bottom:0;top:var(--head,120px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;background:var(--bg)}
  #finger canvas{position:absolute;left:0;top:0}
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body class="lock">
<header id="head">
  <div class="brand"><div class="logo">☕</div><h1>커피 내기</h1><small id="modeHint">손가락을 올려주세요</small></div>
  <div class="seg" role="tablist">
    <div class="thumb" id="thumb"></div>
    <button class="tab on" data-mode="finger" role="tab">👆 손가락</button>
    <button class="tab" data-mode="roulette" role="tab">🎡 룰렛</button>
    <button class="tab" data-mode="ladder" role="tab">🪜 사다리</button>
  </div>
</header>

<div id="finger" data-phase="idle" data-count="0"><canvas id="fcv"></canvas></div>

<main id="main" class="hidden">
  <div class="hero"><h2 id="heroTitle">오늘 커피는<br>누가 살까요?</h2><p id="heroSub">이름을 적고 룰렛을 돌려 보세요.</p></div>
  <div class="card">
    <div class="row-between">
      <div class="label">참가자<small>2~12명까지 함께해요</small></div>
      <div class="stepper">
        <button class="round" id="minus" aria-label="인원 줄이기">−</button>
        <div class="count" id="count">4명</div>
        <button class="round" id="plus" aria-label="인원 늘리기">+</button>
      </div>
    </div>
    <div class="names" id="names"></div>
  </div>
  <div id="resultSlot"></div>
  <div class="card" id="rouletteCard">
    <div class="wheelWrap" id="wheelWrap">
      <svg class="pointer" width="34" height="40" viewBox="0 0 34 40" aria-hidden="true"><path d="M17 38 C14 33 3 16 3 11 A14 14 0 0 1 31 11 C31 16 20 33 17 38Z" fill="#F2F4F6"/><circle cx="17" cy="12" r="5" fill="#FF8A3D"/></svg>
      <canvas id="wheel"></canvas>
      <button class="hub" id="hub">돌리기</button>
    </div>
    <div class="status" id="rStatus">가운데를 눌러 돌려 보세요</div>
    <div class="btns"><button class="btn pri" id="spin">룰렛 돌리기</button></div>
  </div>
  <div class="card hidden" id="ladderCard">
    <div class="ctitle">사다리타기</div>
    <p class="hint">이름을 탭하면 그 사람의 길을 따라가요. 아래 칸 하나에 ☕가 숨어 있어요.</p>
    <canvas id="ladder"></canvas>
    <div class="status" id="lStatus"></div>
    <div class="btns two">
      <button class="btn pri" id="all">전체 결과 보기</button>
      <button class="btn" id="newLadder">새 사다리</button>
    </div>
  </div>
  <p class="foot">모든 추첨은 브라우저의 암호학적 난수(crypto.getRandomValues)로 정해져<br>모든 참가자의 확률이 똑같아요.</p>
</main>

<script>
(function(){
"use strict";
var PAL=["#FF6B6B","#FFB547","#4ADE80","#4DA3FF","#B48CFF","#2DD4BF","#FF7AC6","#FF9248","#FACC15","#38BDF8","#A3E635","#FDA4AF"];
var TEASES=["지갑 열 시간이에요 💸","운도 실력이죠 😎 (아마도요)","다들 메뉴 고르세요! 아아 한 잔 추가요 🧊","오늘의 커피 후원자님께 박수 👏","피할 수 없으면 즐기세요 😂","다음엔 꼭 피해 가시길… 🍀"];
var FONT='"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
var TEXT="#F2F4F6",SUB="#8B95A1",MUTE="#4E5968",BG="#0B0D12",S1="#141820",S2="#1C222C",S3="#262E3A",INK="#0E1015";
var MIN=2,MAX=12,SPIN_MS=5200,HOLD=3000;

try{var ic=document.createElement("canvas");ic.width=ic.height=180;var ix=ic.getContext("2d");var gr=ix.createLinearGradient(0,0,180,180);gr.addColorStop(0,"#FFC56B");gr.addColorStop(1,"#FF8A3D");
  ix.fillStyle=gr;ix.fillRect(0,0,180,180);ix.font="104px sans-serif";ix.textAlign="center";ix.textBaseline="middle";ix.fillText("☕",90,98);$id("appleIcon").href=ic.toDataURL("image/png");}catch(e){}
function $id(i){return document.getElementById(i);}

// ---- 공정한 난수 ----
function randU32(){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0];}
function randInt(n){var lim=Math.floor(4294967296/n)*n,x=randU32();while(x>=lim)x=randU32();return x%n;}
function rand01(){return randU32()/4294967296;}

function setup(cv,W,H){var d=Math.min(3,window.devicePixelRatio||1),pw=Math.round(W*d),ph=Math.round(H*d);
  if(cv.width!==pw)cv.width=pw;if(cv.height!==ph)cv.height=ph;cv.style.width=W+"px";cv.style.height=H+"px";
  var c=cv.getContext("2d");c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,W,H);return c;}
function fit(c,s,m){if(c.measureText(s).width<=m)return s;var t=s;while(t.length>1&&c.measureText(t+"…").width>m)t=t.slice(0,-1);return t+"…";}
function rr(c,x,y,w,h,r){var k=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+k,y);c.arcTo(x+w,y,x+w,y+h,k);c.arcTo(x+w,y+h,x,y+h,k);c.arcTo(x,y+h,x,y,k);c.arcTo(x,y,x+w,y,k);c.closePath();}
function txt(c,s,x,y,size,w,col,m){c.font=w+" "+size+"px "+FONT;c.fillStyle=col;c.fillText(fit(c,s,m),x,y);}
function alpha(hex,a){var n=parseInt(hex.slice(1),16);return"rgba("+(n>>16)+","+((n>>8)&255)+","+(n&255)+","+a+")";}
function circle(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(0,r),0,Math.PI*2);}

// ---- 컨페티 ----
function confetti(){var cv=document.createElement("canvas");cv.className="confetti";document.body.appendChild(cv);
  var W=innerWidth,H=innerHeight,c=setup(cv,W,H),t0=performance.now(),ps=[];
  for(var i=0;i<200;i++){var L=i%2===0;ps.push({x:L?-10:W+10,y:H*(.55+Math.random()*.25),vx:(L?1:-1)*(3+Math.random()*9),vy:-(9+Math.random()*12),s:5+Math.random()*7,r:Math.random()*6.28,vr:(Math.random()-.5)*.35,c:PAL[i%PAL.length],k:i%3});}
  (function tick(t){var el=t-t0;c.clearRect(0,0,W,H);c.globalAlpha=el>3000?Math.max(0,1-(el-3000)/900):1;
    ps.forEach(function(p){p.vy+=.3;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;
      if(p.k===0){circle(c,0,0,p.s/2.6);c.fill();}else c.fillRect(-p.s/2,-p.s/4,p.s,p.s/(p.k===1?2:4));c.restore();});
    if(el<3900)requestAnimationFrame(tick);else cv.remove();})(t0);}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

// ---- 상태 ----
var mode="finger",count=4,names=[];for(var q=0;q<MAX;q++)names.push("");
function display(){var a=[];for(var i=0;i<count;i++)a.push(names[i].trim()||("참가자"+(i+1)));return a;}
var head=$id("head"),finger=$id("finger"),main=$id("main");
function syncHead(){document.documentElement.style.setProperty("--head",head.offsetHeight+"px");}
var MODES=["finger","roulette","ladder"],HINTS={finger:"손가락을 올려주세요",roulette:"이름을 넣고 돌려요",ladder:"이름을 탭해 따라가요"};
document.querySelectorAll(".tab").forEach(function(b){b.addEventListener("click",function(){setMode(b.dataset.mode);});});
function setMode(m){mode=m;document.querySelectorAll(".confetti").forEach(function(x){x.remove();});document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.mode===m);b.setAttribute("aria-selected",b.dataset.mode===m);});
  $id("thumb").style.transform="translateX("+(MODES.indexOf(m)*100)+"%)";$id("modeHint").textContent=HINTS[m];
  var f=m==="finger";finger.classList.toggle("hidden",!f);main.classList.toggle("hidden",f);document.body.classList.toggle("lock",f);
  $id("rouletteCard").classList.toggle("hidden",m!=="roulette");$id("ladderCard").classList.toggle("hidden",m!=="ladder");
  $id("heroSub").textContent=m==="roulette"?"이름을 적고 룰렛을 돌려 보세요.":"이름을 적고 사다리를 타 보세요.";
  newRound();if(!f){window.scrollTo(0,0);drawAll();}else fReset();syncHead();}

// ---- 참가자 ----
function renderNames(){var box=$id("names");box.innerHTML="";for(var i=0;i<count;i++){(function(i){var d=document.createElement("div");d.className="nm";d.style.animationDelay=(i*18)+"ms";
  var dot=document.createElement("i");dot.style.background=PAL[i];dot.style.color=alpha(PAL[i],.6);var inp=document.createElement("input");inp.maxLength=10;inp.placeholder="참가자"+(i+1);inp.value=names[i];inp.enterKeyHint="done";
  inp.addEventListener("input",function(){names[i]=inp.value;drawAll();});d.appendChild(dot);d.appendChild(inp);box.appendChild(d);})(i);}
  $id("count").textContent=count+"명";syncStepper();}
function syncStepper(){$id("minus").disabled=spinning||count<=MIN;$id("plus").disabled=spinning||count>=MAX;}
$id("minus").onclick=function(){if(spinning||count<=MIN)return;count--;renderNames();newRound();drawAll();};
$id("plus").onclick=function(){if(spinning||count>=MAX)return;count++;renderNames();newRound();drawAll();};

// ---- 결과 바텀시트 ----
var timers=[];
function showWinner(name,color){closeResult();var o=document.createElement("div");o.className="overlay";o.id="result";
  o.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="badge">☕</div><div class="eyebrow">오늘의 커피 당번은</div><div class="who"></div><div class="tease"></div><div class="btns two"><button class="btn pri" id="again">다시하기</button><button class="btn" id="closeR">닫기</button></div></div>';
  var b=o.querySelector(".badge");b.style.background=color;b.style.boxShadow="0 0 0 8px "+alpha(color,.18)+",0 12px 40px "+alpha(color,.5);
  o.querySelector(".who").textContent=name+"님!";o.querySelector(".who").style.color=color;o.querySelector(".tease").textContent=TEASES[randInt(TEASES.length)];
  document.body.appendChild(o);$id("again").onclick=function(){newRound();drawAll();};$id("closeR").onclick=closeResult;
  o.addEventListener("click",function(e){if(e.target===o)closeResult();});buzz([30,40,120]);setTimeout(confetti,120);}
function closeResult(){var r=$id("result");if(r)r.remove();}
function newRound(){timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(lRaf);anim=null;spinning=false;closeResult();
  $id("lStatus").textContent="";lad=makeLadder(count);revealed=new Array(count).fill(false);updLadderBtns();
  $id("wheel").style.transition="none";$id("rStatus").textContent="가운데를 눌러 돌려 보세요";$id("hub").textContent="돌리기";
  $id("spin").disabled=false;$id("hub").disabled=false;syncStepper();}

// ---- 룰렛 ----
var rot=0,spinning=false;
function drawWheel(){var wrap=$id("wheelWrap"),S=Math.max(240,Math.min($id("rouletteCard").clientWidth-40,400));wrap.style.width=S+"px";wrap.style.height=S+"px";
  var hub=$id("hub"),hs=Math.max(76,S*.25);hub.style.width=hs+"px";hub.style.height=hs+"px";
  var nm=display(),n=nm.length,c=setup($id("wheel"),S,S),m=S/2,R=S/2-2,bez=Math.max(10,S*.04),r=R-bez,seg=Math.PI*2/n;
  // 베젤
  circle(c,m,m,R);c.fillStyle=S2;c.fill();
  for(var k=0;k<n*2;k++){var a=-Math.PI/2+k*seg/2;circle(c,m+Math.cos(a)*(R-bez/2),m+Math.sin(a)*(R-bez/2),Math.max(2,bez*.18));c.fillStyle=k%2?"rgba(255,255,255,.35)":"#FFD58A";c.fill();}
  for(var i=0;i<n;i++){var a0=-Math.PI/2+i*seg;c.beginPath();c.moveTo(m,m);c.arc(m,m,r,a0,a0+seg);c.closePath();c.fillStyle=PAL[i];c.fill();}
  var sh=c.createRadialGradient(m,m,r*.2,m,m,r);sh.addColorStop(0,"rgba(255,255,255,.18)");sh.addColorStop(.6,"rgba(255,255,255,0)");sh.addColorStop(1,"rgba(0,0,0,.18)");circle(c,m,m,r);c.fillStyle=sh;c.fill();
  c.strokeStyle=BG;c.lineWidth=2.5;for(i=0;i<n;i++){var aa=-Math.PI/2+i*seg;c.beginPath();c.moveTo(m,m);c.lineTo(m+Math.cos(aa)*r,m+Math.sin(aa)*r);c.stroke();}
  var fs=Math.max(12,Math.min(19,S/(n>8?21:16)));c.font="700 "+fs+"px "+FONT;c.fillStyle=INK;c.textAlign="right";c.textBaseline="middle";
  for(i=0;i<n;i++){c.save();c.translate(m,m);c.rotate(-Math.PI/2+(i+.5)*seg);c.fillText(fit(c,nm[i],r*.55),r-14,0);c.restore();}}
function spin(){if(spinning)return;closeResult();var n=count,i=randInt(n),seg=360/n,center=(i+.5)*seg+(rand01()-.5)*seg*.7;
  var base=rot+360*(5+randInt(3)),target=base+((((-center-base)%360)+360)%360),name=display()[i];spinning=true;rot=target;
  var w=$id("wheel");w.style.transition="transform "+SPIN_MS+"ms cubic-bezier(0.15,0.7,0.1,1)";void w.offsetWidth;w.style.transform="rotate("+rot+"deg)";
  $id("rStatus").textContent="두구두구두구… 🥁";$id("hub").textContent="🥁";$id("spin").disabled=true;$id("hub").disabled=true;syncStepper();buzz(15);
  timers.push(setTimeout(function(){spinning=false;w.style.transition="none";$id("spin").disabled=false;$id("hub").disabled=false;$id("hub").textContent="돌리기";
    $id("rStatus").textContent="결과가 나왔어요!";syncStepper();showWinner(name,PAL[i]);},SPIN_MS+150));}
$id("spin").onclick=spin;$id("hub").onclick=spin;

// ---- 사다리 ----
var lad,revealed,anim=null,lRaf=0;
function makeLadder(n){var levels=Math.max(8,Math.min(14,n+6)),rungs=[],l,j;
  for(l=0;l<levels;l++){var row=[];for(j=0;j<n-1;j++){var prev=j>0&&row[j-1];row.push(!prev&&rand01()<.45);}rungs.push(row);}
  for(var pass=0;pass<30;pass++){var ok=true;for(j=0;j<n-1;j++){var has=false;for(l=0;l<levels;l++)if(rungs[l][j])has=true;
    if(!has){ok=false;l=randInt(levels);rungs[l][j]=true;if(j>0)rungs[l][j-1]=false;if(j<n-2)rungs[l][j+1]=false;}}if(ok)break;}
  return{n:n,levels:levels,rungs:rungs,coffee:randInt(n)};}
function walk(L,s){var c=s,pts=[[c,0]];for(var lv=0;lv<L.levels;lv++){var y=lv+1;
  if(c<L.n-1&&L.rungs[lv][c]){pts.push([c,y]);c++;pts.push([c,y]);}else if(c>0&&L.rungs[lv][c-1]){pts.push([c,y]);c--;pts.push([c,y]);}}
  pts.push([c,L.levels+1]);return{pts:pts,end:c};}
function drawLadder(){var cv=$id("ladder"),W=Math.max(240,$id("ladderCard").clientWidth-40),H=lad.levels*28+130,c=setup(cv,W,H),n=lad.n,sp=W/n,nm=display();
  var X=function(k){return sp*(k+.5);},topY=56,botY=H-58,Y=function(k){return topY+k*(botY-topY)/(lad.levels+1);};
  c.lineCap="round";c.lineJoin="round";c.strokeStyle=S3;c.lineWidth=4;c.beginPath();
  for(var k=0;k<n;k++){c.moveTo(X(k),topY);c.lineTo(X(k),botY);}
  for(var lv=0;lv<lad.levels;lv++)for(var j=0;j<n-1;j++)if(lad.rungs[lv][j]){c.moveTo(X(j),Y(lv+1));c.lineTo(X(j+1),Y(lv+1));}
  c.stroke();var reached={};
  function path(col,frac){var w=walk(lad,col),pts=w.pts.map(function(p){return[X(p[0]),Y(p[1])];}),tot=0,i;
    for(i=1;i<pts.length;i++)tot+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    var left=frac*tot,cl=PAL[col],hx=pts[0][0],hy=pts[0][1];c.save();c.strokeStyle=cl;c.lineWidth=5;c.shadowColor=alpha(cl,.7);c.shadowBlur=12;c.beginPath();c.moveTo(hx,hy);
    for(i=1;i<pts.length;i++){var d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
      if(left>=d){c.lineTo(pts[i][0],pts[i][1]);hx=pts[i][0];hy=pts[i][1];left-=d;}else{var r=d>0?left/d:0;hx=pts[i-1][0]+(pts[i][0]-pts[i-1][0])*r;hy=pts[i-1][1]+(pts[i][1]-pts[i-1][1])*r;c.lineTo(hx,hy);break;}}
    c.stroke();c.restore();if(frac<.999){circle(c,hx,hy,8);c.fillStyle="#fff";c.fill();circle(c,hx,hy,4.5);c.fillStyle=cl;c.fill();}else reached[w.end]=true;}
  for(k=0;k<n;k++)if(revealed[k]&&!(anim&&anim.cols.indexOf(k)>=0))path(k,1);
  if(anim)anim.cols.forEach(function(k){path(k,anim.p);});
  var fs=Math.max(11,Math.min(15,sp*.3)),cw=Math.min(sp-6,92);c.textAlign="center";c.textBaseline="middle";
  for(k=0;k<n;k++){rr(c,X(k)-cw/2,8,cw,34,12);c.fillStyle=PAL[k];c.fill();txt(c,nm[k],X(k),25.5,fs,700,INK,cw-8);}
  for(var b=0;b<n;b++){var y0=botY+14;rr(c,X(b)-cw/2,y0,cw,36,12);
    if(reached[b]&&b===lad.coffee){var g=c.createLinearGradient(0,y0,0,y0+36);g.addColorStop(0,"#FFC56B");g.addColorStop(1,"#FF8A3D");c.fillStyle=g;c.fill();txt(c,cw>=64?"☕ 커피":"☕",X(b),y0+18.5,fs+1,800,"#1A1206",cw);}
    else if(reached[b]){c.fillStyle=S2;c.fill();txt(c,"통과",X(b),y0+18.5,fs,600,SUB,cw-4);}
    else{c.fillStyle=S2;c.fill();txt(c,"?",X(b),y0+18.5,fs+3,800,MUTE,cw);}}}
function updLadderBtns(){var all=revealed.every(Boolean);$id("all").disabled=!!anim||all;}
function trace(cols){if(anim)return;var todo=cols.filter(function(k){return!revealed[k];});if(!todo.length)return;
  $id("lStatus").textContent="따라가는 중… 👀";var dur=todo.length>1?2400:1700,t0=performance.now();anim={cols:todo,p:0};updLadderBtns();
  (function step(t){var raw=Math.min(1,(t-t0)/dur);anim.p=raw<.5?2*raw*raw:1-Math.pow(-2*raw+2,2)/2;drawLadder();
    if(raw<1){lRaf=requestAnimationFrame(step);return;}
    anim=null;todo.forEach(function(k){revealed[k]=true;});drawLadder();updLadderBtns();
    var nm=display(),hit=todo.filter(function(k){return walk(lad,k).end===lad.coffee;})[0];
    if(hit!==undefined){$id("lStatus").textContent="☕ 당첨!";timers.push(setTimeout(function(){showWinner(nm[hit],PAL[hit]);},350));}
    else $id("lStatus").textContent=todo.length===1?nm[todo[0]]+"님은 통과! 휴~ 😮‍💨":"";})(t0);}
$id("ladder").addEventListener("click",function(e){var r=this.getBoundingClientRect(),k=Math.floor((e.clientX-r.left)/(r.width/lad.n));if(k>=0&&k<lad.n)trace([k]);});
$id("all").onclick=function(){var a=[];for(var i=0;i<lad.n;i++)a.push(i);trace(a);};
$id("newLadder").onclick=function(){newRound();drawAll();};
function drawAll(){if(mode==="roulette")drawWheel();if(mode==="ladder")drawLadder();}

// ---- 👆 손가락 고르기 ----
// 손가락을 대면 원이 작게 나타나 멈추지 않고 계속 커지고, 2명 이상이 HOLD(3초) 동안 그대로면 그 성장 끝에서 한 명이 결정된다.
var fcv=$id("fcv"),fingers=new Map(),st={phase:"idle",last:performance.now(),picked:null};
var touchCapable=(navigator.maxTouchPoints||0)>1;
function fReset(){fingers.clear();st.phase="idle";st.picked=null;st.last=performance.now();delete finger.dataset.winner;}
function fpos(e){var r=finger.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
function freeColor(){var used={};fingers.forEach(function(f){used[f.color]=1;});var free=PAL.filter(function(c){return!used[c];});return free.length?free[randInt(free.length)]:PAL[randInt(PAL.length)];}
finger.addEventListener("pointerdown",function(e){e.preventDefault();if(st.phase==="picked"){if(fingers.size>0)return;st.phase="idle";st.picked=null;delete finger.dataset.winner;}
  var p=fpos(e);fingers.set(e.pointerId,{x:p[0],y:p[1],color:freeColor(),born:performance.now(),spin:rand01()*6.28});st.last=performance.now();buzz(8);
  try{finger.setPointerCapture(e.pointerId);}catch(_){} },{passive:false});
window.addEventListener("pointermove",function(e){var f=fingers.get(e.pointerId);if(!f)return;var p=fpos(e);f.x=p[0];f.y=p[1];},{passive:false});
function fup(e){if(!fingers.has(e.pointerId))return;fingers.delete(e.pointerId);if(st.phase!=="picked")st.last=performance.now();}
window.addEventListener("pointerup",fup);window.addEventListener("pointercancel",fup);
["touchstart","touchmove","touchend","contextmenu","selectstart","gesturestart","gesturechange","dblclick"].forEach(function(ev){finger.addEventListener(ev,function(e){e.preventDefault();},{passive:false});});
document.addEventListener("touchmove",function(e){if(mode==="finger")e.preventDefault();},{passive:false});

function baseR(W,H){return Math.max(26,Math.min(W,H)*.075);}
function pickR(W,H){return Math.max(78,Math.min(140,Math.min(W,H)*.22));}
// 마지막 변화 후 경과 t(ms)에 따른 반지름: 처음부터 끝까지 멈추지 않고 커짐
function growR(t,W,H){var r0=baseR(W,H),r1=pickR(W,H),p=Math.min(1,t/HOLD),r=r0+(r1-r0)*(0.35*p+0.65*p*p);
  if(t>HOLD)r=r1+(r1*.5)*(1-Math.exp(-(t-HOLD)/2500));return r;}
function pick(now,W,H){var list=Array.from(fingers.values());if(list.length<2)return;var w=list[randInt(list.length)],r=growR(now-st.last,W,H);
  st.picked={x:w.x,y:w.y,color:w.color,at:now,r0:r,others:list.filter(function(f){return f!==w;}).map(function(f){return{x:f.x,y:f.y,color:f.color};})};
  st.phase="picked";finger.dataset.winner=w.color;buzz([40,60,180]);setTimeout(confetti,520);}
function drawGrowing(c,f,now,t,W,H){var p=Math.min(1,t/HOLD),r=growR(t,W,H),beat=Math.sin(now/1000*Math.PI*2*(1.6+p*3.2)),pr=r*(1+beat*(.025+.035*p));
  var g=c.createRadialGradient(f.x,f.y,pr*.6,f.x,f.y,pr*1.9);g.addColorStop(0,alpha(f.color,.38));g.addColorStop(1,alpha(f.color,0));circle(c,f.x,f.y,pr*1.9);c.fillStyle=g;c.fill();
  circle(c,f.x,f.y,pr);c.fillStyle=f.color;c.fill();
  circle(c,f.x,f.y,pr*.62);c.fillStyle=alpha("#ffffff",.16+.1*p);c.fill();
  // 회전하는 바깥 링 (점점 빨라짐)
  var sp=f.spin+(now-f.born)/1000*(1.2+p*4);c.lineCap="round";c.lineWidth=Math.max(3,pr*.07);c.strokeStyle=alpha(f.color,.85);
  for(var k=0;k<3;k++){c.beginPath();c.arc(f.x,f.y,pr+10+pr*.08,sp+k*2.094,sp+k*2.094+1.2);c.stroke();}
  circle(c,f.x,f.y,pr*.2);c.fillStyle="#fff";c.fill();}
(function ftick(now){
  if(mode==="finger"){var W=finger.clientWidth,H=finger.clientHeight,c=setup(fcv,W,H),mw=W-32;c.textAlign="center";c.textBaseline="middle";
    var n=fingers.size,phase=st.phase,rNow=0;
    if(st.phase!=="picked"){var t=now-st.last;
      if(n>=2&&t>=HOLD)pick(now,W,H);
      if(st.phase!=="picked"){phase=n>0?"growing":"idle";st.phase=phase;
        var vg=c.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.hypot(W,H)/2);vg.addColorStop(0,"#121620");vg.addColorStop(1,BG);c.fillStyle=vg;c.fillRect(0,0,W,H);
        if(n===0){var pulse=1+Math.sin(now/420)*.06,cy=H/2-70;circle(c,W/2,cy,46*pulse+18);c.fillStyle="rgba(255,181,71,.08)";c.fill();circle(c,W/2,cy,46*pulse);c.fillStyle="rgba(255,181,71,.16)";c.fill();
          txt(c,"👆",W/2,cy+2,38,400,TEXT,80);
          txt(c,"다 같이 화면에",W/2,H/2+20,26,800,TEXT,mw);txt(c,"손가락을 올려주세요",W/2,H/2+56,26,800,TEXT,mw);
          txt(c,"원이 커지다가 한 명이 뽑혀요",W/2,H/2+94,15,500,SUB,mw);
          if(!touchCapable)txt(c,"이 모드는 휴대폰에서 해주세요 · 마우스는 한 명만 돼요",W/2,H-36,13,500,MUTE,mw);}
        else{fingers.forEach(function(f){drawGrowing(c,f,now,t,W,H);});rNow=growR(t,W,H);
          txt(c,n===1?"한 명 더 손가락을 올려주세요":"그대로 손가락을 떼지 마세요",W/2,30,17,700,n===1?TEXT:SUB,mw);}}}
    var p=st.picked;
    if(st.phase==="picked"&&p){phase="picked";var el=now-p.at,full=Math.hypot(Math.max(p.x,W-p.x),Math.max(p.y,H-p.y))+4,k=Math.min(1,el/750),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
      c.fillStyle=BG;c.fillRect(0,0,W,H);
      var fade=Math.max(0,1-el/300);if(fade>0)p.others.forEach(function(f){c.globalAlpha=fade;circle(c,f.x,f.y,p.r0*fade);c.fillStyle=f.color;c.fill();});c.globalAlpha=1;
      var R=p.r0+(full-p.r0)*e;circle(c,p.x,p.y,R);c.fillStyle=p.color;c.fill();rNow=R;
      if(el>650){var a=Math.min(1,(el-650)/350),ring=(el%1400)/1400,rr0=Math.max(56,Math.min(W,H)*.14);c.globalAlpha=a;
        c.strokeStyle="rgba(14,16,21,"+(.35*(1-ring))+")";c.lineWidth=4;circle(c,p.x,p.y,rr0+10+ring*56);c.stroke();
        circle(c,p.x,p.y,rr0);c.fillStyle=INK;c.fill();txt(c,"☕",p.x,p.y+2,rr0*.9,400,TEXT,rr0*2);
        var ty=p.y>H/2?p.y-rr0-118:p.y+rr0+96;ty=Math.max(48,Math.min(H-90,ty));
        txt(c,"커피 당번!",W/2,ty,40,900,INK,mw);txt(c,"오늘은 이 손가락이 쏩니다 ☕",W/2,ty+38,16,700,"rgba(14,16,21,.7)",mw);
        txt(c,n>0?"손을 모두 떼면 다시 할 수 있어요":"다시 손가락을 올리면 새 판이 시작돼요",W/2,H-28,14,700,"rgba(14,16,21,.6)",mw);c.globalAlpha=1;}}
    finger.dataset.phase=phase;finger.dataset.count=String(n);finger.dataset.r=String(Math.round(rNow));}
  requestAnimationFrame(ftick);})(performance.now());

window.addEventListener("resize",function(){syncHead();drawAll();});
if(document.fonts&&document.fonts.load){document.fonts.load('700 16px "Pretendard Variable"',"참가자커피당번돌리기통과사다리룰렛").then(function(){drawAll();syncHead();}).catch(function(){});}
renderNames();newRound();syncHead();setTimeout(syncHead,300);
})();
